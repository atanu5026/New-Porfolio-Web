<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Atanu's Portfolio</title>
</head>
<body>
    <header>
        <nav class="NavBar">
            <section class="leftSection">
                <div class="logoText">
                    <H1>Atanu's Portfolio</H1>
                </div>
            </section>
            <section class="RightSection">
                <ul>
                    <a class="navTools" href="/"><li>Home</li></a>
                    <a class="navTools" href="/"><li>About</li></a>
                    <a class="navTools" href="/"><li>Experience</li></a>
                    <a class="navTools" href="/"><li>Projects</li></a>
                    <a class="navTools" href="/"><li>Contact</li></a>
                </ul>
            </section>
        </nav>
    </header>
    <main>
        <section class="section1">
            <div class="left">
                <div class="textLeft">Hi, I am <span id="Atanu">Atanu</span></div>
                <div class="textLeft">a passionate </div>
                <span class="autoType"></span>
            </div>
            <div class="right">
                <img src="bg2.png" alt="developer_male">
            </div>
        </section>
        <hr id="break1">
        <section class="section2">
            
        </section>
    </main>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script>
        var typed = new Typed(".autoType", {
            strings: ["Developer", "Designer", "Coder", "Gamer", "Student", "Youtuber"],
            typeSpeed: 150,
            backSpeed: 150,
            loop: true
        });
        
        const menu = document.querySelector("#menu");
        const navMenu = document.querySelector(".navMenu");

        menu.addEventListener("click", () => {
            menu.classList.toggle("active");
            navMenu.classList.toggle("active");
        })
        document.querySelectorAll(".list_menu").forEach(n => n.addEventListener("click", () => {
            menu.classList.remove("active");
            navMenu.classList.remove("active");
        }))
    </script>
</body>
</html>
